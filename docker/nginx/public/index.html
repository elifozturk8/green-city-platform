<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenCity - Akıllı Şehir Hava Kalitesi Paneli</title>
    <!-- Tailwind CSS (Arayüz Tasarımı) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS (Harita Kütüphanesi) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: calc(100vh - 70px); }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased">

    <!-- Üst Bar (Navbar) -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center h-[70px]">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🌱</span>
            <h1 class="text-xl font-bold tracking-wide text-emerald-400">GreenCity Platform</h1>
            <span class="text-xs bg-emerald-950 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-800 font-medium">Canlı PostGIS & AI Tahmin</span>
        </div>
        <button onclick="fetchSensors()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
            🔄 Verileri Tazele
        </button>
    </header>

    <!-- Ana İçerik (Sol Panel + Harita) -->
    <div class="flex flex-col md:flex-row h-[calc(100vh-70px)]">
        
        <!-- Sol Yan Panel (Sensör Listesi) -->
        <aside class="w-full md:w-80 bg-gray-800 border-r border-gray-700 p-4 overflow-y-auto">
            <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-4">Aktif Sensörler</h2>
            <div id="sensor-list" class="space-y-3">
                <div class="animate-pulse flex space-x-4 p-3 bg-gray-700/50 rounded-lg">
                    <div class="flex-1 space-y-2 py-1">
                        <div class="h-4 bg-gray-600 rounded w-3/4"></div>
                        <div class="h-3 bg-gray-600 rounded w-1/2"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Harita Alanı -->
        <main class="flex-1 relative">
            <div id="map"></div>
        </main>
    </div>

    <!-- Harita ve API Mantığı -->
    <script>
        // Ankara Merkezli Haritayı Başlat
        const map = L.map('map').setView([39.9208, 32.8541], 13);

        // Koyu Tema Harita Katmanı (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        // AQI Seviyesine Göre Renk Belirleme
        function getAqiColor(aqi) {
            if (aqi <= 30) return '#10b981'; // Yeşil (Mükemmel)
            if (aqi <= 50) return '#f59e0b'; // Sarı (İyi)
            return '#ef4444'; // Kırmızı (Hassas/Riskli)
        }

        // Backend API'den Sensör ve AI Tahmin Verilerini Çek
        async function fetchSensors() {
            try {
                const res = await fetch('/api/sensors/');
                const sensors = await res.json();

                markersLayer.clearLayers();
                const listEl = document.getElementById('sensor-list');
                listEl.innerHTML = '';

                sensors.forEach(sensor => {
                    const color = getAqiColor(sensor.aqi);

                    // 1. Haritada Daire Pin (CircleMarker) Oluştur
                    const marker = L.circleMarker([sensor.lat, sensor.lng], {
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.6,
                        radius: 12
                    });

                    // AI Tahmin Bilgisi Varsa Popup İçeriğini Hazırla
                    const pred = sensor.prediction || {};
                    const popupContent = `
                        <div class="p-2 text-gray-900 font-sans">
                            <h3 class="font-bold text-base mb-1 text-gray-800">${sensor.sensorName}</h3>
                            <p class="text-xs text-gray-500 mb-2">Konum: ${sensor.lat.toFixed(4)}, ${sensor.lng.toFixed(4)}</p>
                            
                            <div class="bg-gray-100 p-2 rounded border mb-2 flex justify-between items-center">
                                <span class="text-xs font-semibold text-gray-600">Mevcut AQI:</span>
                                <span class="text-sm font-bold" style="color: ${color}">${sensor.aqi}</span>
                            </div>

                            ${pred.predictedAqiIn1Hour ? `
                                <div class="bg-emerald-50 border border-emerald-200 p-2 rounded">
                                    <div class="flex justify-between items-center text-xs font-semibold text-emerald-800">
                                        <span>🤖 1 Saat Sonra (ML):</span>
                                        <span class="text-sm font-bold text-emerald-900">${pred.predictedAqiIn1Hour} AQI</span>
                                    </div>
                                    <p class="text-[11px] text-emerald-700 mt-1"><strong>Trend:</strong> ${pred.trend}</p>
                                    <p class="text-[11px] text-emerald-700 mt-0.5"><strong>Tavsiye:</strong> ${pred.recommendation}</p>
                                </div>
                            ` : '<p class="text-xs text-gray-400">Tahmin verisi yüklenemedi.</p>'}
                        </div>
                    `;

                    marker.bindPopup(popupContent);
                    markersLayer.addLayer(marker);

                    // 2. Sol Panele Sensör Kartını Ekle
                    const card = document.createElement('div');
                    card.className = "p-3 bg-gray-700/60 hover:bg-gray-700 rounded-lg cursor-pointer transition border border-gray-600/50";
                    card.onclick = () => {
                        map.setView([sensor.lat, sensor.lng], 15);
                        marker.openPopup();
                    };

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <h4 class="font-medium text-sm text-gray-200">${sensor.sensorName}</h4>
                            <span class="text-xs px-2 py-0.5 rounded font-bold text-white" style="background-color: ${color}">
                                ${sensor.aqi} AQI
                            </span>
                        </div>
                        ${pred.predictedAqiIn1Hour ? `
                            <p class="text-xs text-emerald-400 font-medium">🤖 Tahmin: ${pred.predictedAqiIn1Hour} AQI (${pred.trend})</p>
                        ` : ''}
                    `;

                    listEl.appendChild(card);
                });

            } catch (err) {
                console.error("Sensör verileri çekilemedi:", err);
            }
        }

        // Sayfa Yüklenince Verileri Getir
        fetchSensors();
    </script>
</body>
</html>

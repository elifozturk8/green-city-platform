version: '3.8'

services:
  # 1. PostgreSQL + PostGIS (Coğrafi/CBS Veri Tabanı)
  postgres-db:
    image: postgis/postgis:16-3.4
    container_name: greencity-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - green-city-net

  # 2. Redis (Cache & Rate Limiting için)
  redis-cache:
    image: redis:7-alpine
    container_name: greencity-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - green-city-net

  # 3. Nginx API Gateway (Tüm trafiği karşılayacak)
  api-gateway:
    image: nginx:alpine
    container_name: greencity-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - postgres-db
      - redis-cache
    networks:
      - green-city-net

networks:
  green-city-net:
    driver: bridge

volumes:
  postgres_data: